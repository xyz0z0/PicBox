services:
  picbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: picbox:resource-test
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "127.0.0.1:3001:3001"
# Temporary smoke-test storage only. Use the Python resource test for repeatable
# 256/512MiB measurements on disk-backed, isolated temporary data directories.
